name: CI

# Runs on pull requests and reusable verification calls from Deploy. Pushes are owned by the
# deployment workflow so verification runs once as the deployment gate. Needs no Cloudflare
# credentials — integration tests use Miniflare (real local bindings), not the live account.
on:
  pull_request:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: false
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  NX_CACHE_DIRECTORY: .nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: .nx/workspace-data

jobs:
  reuse-evidence:
    name: Reuse exact-tree verification
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
      source_run_url: ${{ steps.lookup.outputs.source_run_url }}
      tree: ${{ steps.lookup.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - id: target-tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TARGET_TREE: ${{ steps.target-tree.outputs.tree }}
        run: node tools/ci/verified-staging-tree.mjs

  dependency-audit:
    name: Dependency advisory audit
    needs: reuse-evidence
    if: >-
      always() &&
      needs.reuse-evidence.outputs.reuse != 'true' &&
      !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check dependency advisories
        run: npm audit --package-lock-only --audit-level=high

  quality:
    name: Format, sync, typecheck, lint and test
    needs: reuse-evidence
    if: >-
      always() &&
      needs.reuse-evidence.outputs.reuse != 'true' &&
      !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7

      - &node
        uses: actions/setup-node@v7
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm

      - &nx-cache
        name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*-v*.db
          key: nx24-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ github.job }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx24-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ github.job }}-${{ hashFiles('package-lock.json') }}-

      # `node_modules` is about a gigabyte across the root and every workspace, and `npm ci`
      # spends seven minutes on it even with a warm npm cache, because the cost is extraction
      # and linking rather than download. Restoring the tree itself is roughly a minute.
      # Keyed on the exact lockfile and the exact Node version, deliberately without
      # `restore-keys`: a near-miss must reinstall rather than half-populate a tree that
      # `npm ci` would then be skipped for.
      - &modules
        name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - &install
        name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - &nx-range
        name: Resolve affected range
        id: nx-range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting
        run: npm run format:check

      # `nx.json` sets `sync.applyChanges: true`, so local runs silently repair the
      # tsconfig project references. This asserts the repaired state was committed.
      - name: Check Nx tsconfig project references are in sync
        run: npx nx sync:check

      # `lint` includes the Nx module-boundary rules that enforce the one-directional
      # data flow (AGENTS.md §4), so a boundary violation fails CI here.
      - name: Typecheck and lint
        env:
          FULL: ${{ steps.nx-range.outputs.full }}
          NX_BASE: ${{ steps.nx-range.outputs.base }}
          NX_HEAD: ${{ steps.nx-range.outputs.head }}
        run: |
          if [ "$FULL" = "true" ]; then
            npx nx run-many -t typecheck lint --parallel=2
          else
            npx nx affected -t typecheck lint --base="$NX_BASE" --head="$NX_HEAD" --parallel=2
          fi

      - name: Test workspace projects
        env:
          FULL: ${{ steps.nx-range.outputs.full }}
          NX_BASE: ${{ steps.nx-range.outputs.base }}
          NX_HEAD: ${{ steps.nx-range.outputs.head }}
        run: |
          if [ "$FULL" = "true" ]; then
            npx nx run-many -t test --exclude=server-fns --parallel=2
          else
            npx nx affected -t test --exclude=server-fns --base="$NX_BASE" --head="$NX_HEAD" --parallel=2
          fi

  server-tests:
    name: Server functions tests
    needs: reuse-evidence
    if: >-
      always() &&
      needs.reuse-evidence.outputs.reuse != 'true' &&
      !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *node
      - *nx-cache
      - *modules
      - *install
      - *nx-range

      - name: Test server functions with coverage
        run: npx nx run server-fns:test

  build:
    name: Build and Miniflare SEO gate
    needs: reuse-evidence
    if: >-
      always() &&
      needs.reuse-evidence.outputs.reuse != 'true' &&
      !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *node
      - *nx-cache
      - *modules
      - *install
      - *nx-range

      - name: Build
        env:
          FULL: ${{ steps.nx-range.outputs.full }}
          NX_BASE: ${{ steps.nx-range.outputs.base }}
          NX_HEAD: ${{ steps.nx-range.outputs.head }}
        run: |
          if [ "$FULL" = "true" ]; then
            npx nx run-many -t build --parallel=2
          else
            npx nx affected -t build --base="$NX_BASE" --head="$NX_HEAD" --parallel=2
            npx nx run public:build
          fi

      - name: Run Miniflare SEO integration gate
        run: npx nx run public:integration-test

  verification:
    name: Verification evidence
    needs: [reuse-evidence, dependency-audit, quality, server-tests, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm verification evidence
        env:
          BUILD: ${{ needs.build.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          QUALITY: ${{ needs.quality.result }}
          SERVER_TESTS: ${{ needs.server-tests.result }}
          RELEASE_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository }}
          REUSE_EVIDENCE: ${{ needs.reuse-evidence.result }}
          REUSED: ${{ needs.reuse-evidence.outputs.reuse }}
          SOURCE_RUN_URL: ${{ needs.reuse-evidence.outputs.source_run_url }}
          SOURCE_TREE: ${{ needs.reuse-evidence.outputs.tree }}
        run: |
          if [ "$REUSED" = "true" ]; then
            if [ "$REUSE_EVIDENCE" != "success" ] || [ "$QUALITY" != "skipped" ] || [ "$SERVER_TESTS" != "skipped" ] || [ "$BUILD" != "skipped" ] || [ "$DEPENDENCY_AUDIT" != "skipped" ] || [ -z "$SOURCE_RUN_URL" ] || [ -z "$SOURCE_TREE" ]; then
              echo "::error::Exact-tree reuse evidence is incomplete."
              exit 1
            fi
            {
              echo "## Reused exact-tree verification"
              echo
              echo "Source: $SOURCE_RUN_URL"
              echo "Tree: \`$SOURCE_TREE\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RELEASE_PULL_REQUEST" = "true" ]; then
            if [ "$QUALITY" != "skipped" ] || [ "$SERVER_TESTS" != "skipped" ] || [ "$BUILD" != "skipped" ] || [ "$DEPENDENCY_AUDIT" != "skipped" ]; then
              echo "::error::The develop release pull request must not run duplicate checks."
              exit 1
            fi
            exit 0
          fi
          if [ "$QUALITY" != "success" ] || [ "$SERVER_TESTS" != "success" ] || [ "$BUILD" != "success" ] || [ "$DEPENDENCY_AUDIT" != "success" ]; then
            echo "::error::Long CI verification did not complete successfully."
            exit 1
          fi
